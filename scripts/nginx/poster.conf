# ==============================================================================
# Poster Application — Nginx Server Configuration Template
# Place in: /etc/nginx/sites-available/poster.conf
# Enable via: ln -s /etc/nginx/sites-available/poster.conf /etc/nginx/sites-enabled/
# (Or paste into aaPanel Website Configuration)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    
    # Document root MUST point to Laravel's public directory
    root /var/www/poster/public;
    index index.php index.html;

    charset utf-8;

    # Maximum file upload size (supports large PDF resumes and high-res images)
    client_max_body_size 64M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Fast Frontend Loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Inertia / Laravel Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health Check Endpoint
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Favicon and Robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static Assets Caching (Vite build artifacts with hash)
    location ~* ^/(build|storage|assets)/.*\.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM FastCGI Configuration (Adjust socket path if using aaPanel or custom PHP)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # For TCP socket alternative: fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to sensitive hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

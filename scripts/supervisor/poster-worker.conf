; ==============================================================================
; Poster Application — Supervisor Queue Worker Configuration
; File location on server: /etc/supervisor/conf.d/poster-worker.conf
; (Or in aaPanel: App Store > Supervisor Manager > Add Daemon)
; ==============================================================================

[program:poster-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/poster/artisan queue:work database --sleep=2 --timeout=90 --tries=1 --max-time=3600 --memory=256
directory=/var/www/poster
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/poster/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=120
